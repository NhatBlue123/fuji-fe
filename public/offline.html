<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FUJI – Mất kết nối</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f13;
      --card: #18181f;
      --border: #2a2a35;
      --fg: #f0f0f5;
      --muted: #8888a0;
      --pink: #f472b6;
      --pink-dim: rgba(244,114,182,0.15);
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f8f8fc;
        --card: #ffffff;
        --border: #e2e2ec;
        --fg: #111118;
        --muted: #6b6b80;
        --pink: #db2777;
        --pink-dim: rgba(219,39,119,0.08);
      }
    }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      overflow: hidden;
    }

    /* Background blobs */
    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      z-index: 0;
    }
    .blob-1 {
      width: 500px; height: 500px;
      background: rgba(244,114,182,0.06);
      top: -150px; right: -150px;
    }
    .blob-2 {
      width: 400px; height: 400px;
      background: rgba(99,102,241,0.05);
      bottom: -120px; left: -120px;
    }

    .container {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      max-width: 420px;
      width: 100%;
    }

    /* Icon */
    .icon-wrap {
      position: relative;
      margin-bottom: 2rem;
    }
    .icon-circle {
      width: 112px; height: 112px;
      border-radius: 50%;
      background: var(--card);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    .icon-circle svg {
      width: 52px; height: 52px;
      color: var(--muted);
      opacity: 0.7;
    }
    .pulse-ring {
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      border: 2px solid var(--pink);
      opacity: 0.3;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.3; }
      50% { transform: scale(1.08); opacity: 0.1; }
    }

    /* Sakura badge */
    .badge {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 1rem;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
    }

    h1 {
      font-size: 2rem;
      font-weight: 900;
      letter-spacing: -0.02em;
      margin-bottom: 0.75rem;
      line-height: 1.2;
    }

    .desc {
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 0.5rem;
      font-size: 0.95rem;
    }

    .auto-reload {
      font-size: 0.8rem;
      color: var(--muted);
      opacity: 0.6;
      margin-bottom: 2rem;
    }

    /* Buttons */
    .actions {
      display: flex;
      gap: 0.75rem;
      width: 100%;
      margin-bottom: 2rem;
    }
    @media (max-width: 400px) {
      .actions { flex-direction: column; }
    }

    .btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0.75rem 1.25rem;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
      border: none;
    }
    .btn:hover { transform: translateY(-2px); }
    .btn:active { transform: translateY(0); }

    .btn-primary {
      background: var(--pink);
      color: #fff;
      box-shadow: 0 8px 24px rgba(244,114,182,0.35);
    }
    .btn-primary:hover { box-shadow: 0 12px 32px rgba(244,114,182,0.5); }

    .btn-secondary {
      background: var(--card);
      color: var(--fg);
      border: 1px solid var(--border);
    }

    /* Tips card */
    .tips {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.25rem;
      text-align: left;
    }
    .tips-title {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.75rem;
    }
    .tip {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.85rem;
      color: var(--muted);
      padding: 4px 0;
    }
    .tip-icon {
      width: 18px; height: 18px;
      flex-shrink: 0;
      opacity: 0.7;
      color: var(--pink);
    }

    /* Dots animation */
    #dots { display: inline-block; min-width: 18px; }
  </style>
</head>
<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <div class="container">
    <div class="icon-wrap">
      <div class="icon-circle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="1" y1="1" x2="23" y2="23"/>
          <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/>
          <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/>
          <path d="M10.71 5.05A16 16 0 0 1 22.56 9"/>
          <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/>
          <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
          <line x1="12" y1="20" x2="12.01" y2="20"/>
        </svg>
      </div>
      <div class="pulse-ring"></div>
    </div>

    <div class="badge">
      <span>🌸</span>
      <span>FUJI</span>
      <span>🌸</span>
    </div>

    <h1>Mất kết nối mạng</h1>

    <p class="desc">
      Có vẻ như bạn đang offline. Kiểm tra lại kết nối Wi-Fi hoặc dữ liệu di động của bạn.
    </p>

    <p class="auto-reload">
      Trang sẽ tự động tải lại khi có mạng trở lại<span id="dots">.</span>
    </p>

    <div class="actions">
      <button class="btn btn-primary" onclick="window.location.reload()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10"/>
          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
        </svg>
        Thử lại
      </button>
      <a class="btn btn-secondary" href="/">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        Trang chủ
      </a>
    </div>

    <div class="tips">
      <p class="tips-title">Gợi ý</p>
      <div class="tip">
        <svg class="tip-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/>
          <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/>
        </svg>
        Kiểm tra kết nối Wi-Fi của bạn
      </div>
      <div class="tip">
        <svg class="tip-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="2" width="20" height="8" rx="2"/><rect x="2" y="14" width="20" height="8" rx="2"/>
          <line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/>
        </svg>
        Khởi động lại router nếu cần
      </div>
      <div class="tip">
        <svg class="tip-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
        </svg>
        Bật/tắt chế độ máy bay rồi thử lại
      </div>
    </div>
  </div>

  <script>
    // Animate dots
    var d = '.';
    setInterval(function() {
      d = d.length >= 3 ? '.' : d + '.';
      document.getElementById('dots').textContent = d;
    }, 600);

    // Auto reload when back online
    window.addEventListener('online', function() { window.location.reload(); });
  </script>
</body>
</html>
